services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-middleware}
      POSTGRES_USER: ${POSTGRES_USER:-middleware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-middleware} -d ${POSTGRES_DB:-middleware}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-ehr:
    build: ./mocks
    environment:
      MOCK_ROLE: ehr
      MOCK_PORT: "8100"
    ports:
      - "8100:8100"

  mock-satusehat:
    build: ./mocks
    environment:
      MOCK_ROLE: satusehat
      MOCK_PORT: "8200"
    ports:
      - "8200:8200"

  backend:
    build: ./backend
    image: kapselrpld-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://middleware:change_me_db@db:5432/middleware}
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/app/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
      mock-ehr:
        condition: service_started
      mock-satusehat:
        condition: service_started

  worker:
    build: ./backend
    image: kapselrpld-backend:latest
    command: ["python", "-m", "app.queue.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://middleware:change_me_db@db:5432/middleware}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build: ./backend
    image: kapselrpld-backend:latest
    command: ["python", "-m", "app.scheduler.runner"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://middleware:change_me_db@db:5432/middleware}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_SATUSEHAT_ORG_ID: ${SATUSEHAT_ORG_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
