services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-middleware}
      POSTGRES_USER: ${POSTGRES_USER:-middleware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-middleware} -d ${POSTGRES_DB:-middleware}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-ehr:
    build: ./mocks
    environment:
      MOCK_ROLE: ehr
      MOCK_PORT: "8100"
      MOCK_PERSIST_DIR: /data
    ports:
      - "8100:8100"
    volumes:
      - mock_ehr_data:/data

  mock-satusehat:
    build: ./mocks
    environment:
      MOCK_ROLE: satusehat
      MOCK_PORT: "8200"
      MOCK_PERSIST_DIR: /data
    ports:
      - "8200:8200"
    volumes:
      - mock_satusehat_data:/data

  # HAPI-style FHIR profile validator (validates before delivery to SATUSEHAT).
  # Lightweight stand-in for hapi-fhir-validation; replace the image with a real
  # HAPI validator if you need full profile conformance.
  hapi-validator:
    build: ./mocks
    environment:
      MOCK_ROLE: hapi
      MOCK_PORT: "3500"
    ports:
      - "3500:3500"

  # Shared store for multi-instance rate limiting (#15). Optional: the app uses
  # in-memory limiting unless RATE_LIMIT_BACKEND=redis.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: kapselrpld-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://middleware:change_me_db@db:5432/middleware}
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/app/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
      mock-ehr:
        condition: service_started
      mock-satusehat:
        condition: service_started
      hapi-validator:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    image: kapselrpld-backend:latest
    command: ["python", "-m", "app.queue.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://middleware:change_me_db@db:5432/middleware}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build: ./backend
    image: kapselrpld-backend:latest
    command: ["python", "-m", "app.scheduler.runner"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://middleware:change_me_db@db:5432/middleware}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SATUSEHAT_ORG_ID: ${SATUSEHAT_ORG_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  mock_ehr_data:
  mock_satusehat_data:
