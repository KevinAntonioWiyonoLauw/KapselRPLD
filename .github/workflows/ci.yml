name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Batalkan run lama saat ada push baru ke ref yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        working-directory: backend
        run: python -m pytest tests/unit -q

  integration-e2e:
    # Menjalankan integration + e2e terhadap stack sungguhan (db, mocks, backend, worker)
    # dalam mode mock (tanpa kredensial nyata). Meniru scripts/test-all.ps1.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pin nama project agar nama network deterministik: kapselrpld_default
      COMPOSE_PROJECT_NAME: kapselrpld
      # Ambang coverage minimum (unit+integration). Naikkan bertahap seiring cakupan.
      COVERAGE_MIN: "50"
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan .env (mode mock, tanpa secret)
        run: cp .env.example .env

      - name: Build & jalankan stack (db, mocks, backend, worker)
        run: docker compose up -d --build db mock-ehr mock-satusehat backend worker

      - name: Tunggu backend sehat
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "backend up setelah ${i} percobaan"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health

      - name: Seed database (external_systems, policies, mappings)
        run: docker compose exec -T backend python seed.py

      - name: Integration tests
        run: |
          docker run --rm --network kapselrpld_default \
            -e OPENMRS_MODE=mock -e OPENEMR_MODE=mock -e SATUSEHAT_MODE=mock \
            -e OPENMRS_MOCK_URL=http://mock-ehr:8100/openmrs \
            -e OPENEMR_MOCK_URL=http://mock-ehr:8100/openemr \
            -e SATUSEHAT_MOCK_URL=http://mock-satusehat:8200/fhir-r4/v1 \
            -e DATABASE_URL=postgresql+psycopg2://middleware:change_me_db@db:5432/middleware \
            -e ADMIN_API_TOKEN=change_me_admin_token -e APP_ENV=development \
            -v "$PWD/backend:/app" -w /app kapselrpld-backend:latest \
            sh -c "pip install -q pytest pytest-asyncio && python -m pytest tests/integration -q"

      - name: End-to-end tests
        run: |
          docker run --rm --network kapselrpld_default \
            -e OPENMRS_MODE=mock -e OPENEMR_MODE=mock -e SATUSEHAT_MODE=mock \
            -e OPENMRS_MOCK_URL=http://mock-ehr:8100/openmrs \
            -e OPENEMR_MOCK_URL=http://mock-ehr:8100/openemr \
            -e SATUSEHAT_MOCK_URL=http://mock-satusehat:8200/fhir-r4/v1 \
            -e DATABASE_URL=postgresql+psycopg2://middleware:change_me_db@db:5432/middleware \
            -e ADMIN_API_TOKEN=change_me_admin_token -e APP_ENV=development \
            -e API_BASE=http://backend:8000 \
            -v "$PWD/backend:/app" -w /app kapselrpld-backend:latest \
            sh -c "pip install -q pytest pytest-asyncio && python -m pytest tests/e2e -q"

      - name: Coverage report + gate (unit + integration)
        # Menjalankan unit+integration dengan coverage dan memfailkan job bila
        # total coverage < ambang (COVERAGE_MIN). coverage.xml diunggah sebagai artifact.
        run: |
          mkdir -p coverage
          docker run --rm --network kapselrpld_default \
            -e OPENMRS_MODE=mock -e OPENEMR_MODE=mock -e SATUSEHAT_MODE=mock \
            -e OPENMRS_MOCK_URL=http://mock-ehr:8100/openmrs \
            -e OPENEMR_MOCK_URL=http://mock-ehr:8100/openemr \
            -e SATUSEHAT_MOCK_URL=http://mock-satusehat:8200/fhir-r4/v1 \
            -e DATABASE_URL=postgresql+psycopg2://middleware:change_me_db@db:5432/middleware \
            -e ADMIN_API_TOKEN=change_me_admin_token -e APP_ENV=development \
            -v "$PWD/backend:/app" -v "$PWD/mocks:/mocks:ro" -v "$PWD/coverage:/coverage" -w /app kapselrpld-backend:latest \
            sh -c "pip install -q pytest pytest-asyncio pytest-cov && \
                   python -m pytest tests/unit tests/integration -q \
                     --cov=app --cov-report=term --cov-report=xml:/coverage/coverage.xml \
                     --cov-fail-under=${COVERAGE_MIN}"

      - name: Unggah laporan coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.xml

      - name: Log container saat gagal
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Teardown
        if: always()
        run: docker compose down -v

  e2e-dashboard:
    # Playwright e2e + accessibility (axe) terhadap dashboard yang berjalan.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: kapselrpld
      DASHBOARD_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan .env (mode mock, tanpa secret)
        run: cp .env.example .env

      - name: Build & jalankan stack (db, mocks, backend, worker, dashboard)
        run: docker compose up -d --build db mock-ehr mock-satusehat backend worker dashboard

      - name: Tunggu backend & dashboard siap
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000 >/dev/null && echo "dashboard up"

      - name: Seed database
        run: docker compose exec -T backend python seed.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard deps + Playwright browser
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Jalankan Playwright (e2e + a11y)
        working-directory: frontend
        run: npx playwright test --reporter=list

      - name: Unggah laporan Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Log container saat gagal
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Teardown
        if: always()
        run: docker compose down -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Siapkan .env (wajib ada karena compose memakai env_file: .env)"
        run: cp .env.example .env
      - name: Validate docker-compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build backend mock-ehr mock-satusehat
