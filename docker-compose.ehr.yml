# Profil EHR ASLI (opsional, berat) — OpenMRS + OpenEMR dengan database masing-masing.
# Gunakan bersama file utama agar ikut jaringan default middleware:
#   docker compose -f docker-compose.yml -f docker-compose.ehr.yml --profile ehr up -d
# Lalu set di .env:  OPENMRS_MODE=real, OPENEMR_MODE=real,
#   OPENMRS_FHIR_BASE_URL=http://openmrs:8080/openmrs/ws/fhir2/R4
#   OPENEMR_FHIR_BASE_URL=http://openemr/apis/default/fhir
# CATATAN: image resmi bisa memakan RAM besar (OpenMRS JVM ~2-4GB) dan waktu boot lama.
#         Enable FHIR API di OpenEMR (Administration > Config > Connectors) setelah naik.

services:
  openmrs-db:
    image: mysql:8.0
    profiles: ["ehr"]
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: openmrs
      MYSQL_ROOT_PASSWORD: openmrs
    volumes:
      - openmrs_db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  openmrs:
    image: openmrs/openmrs-reference-application-distro:latest
    profiles: ["ehr"]
    environment:
      DB_HOST: openmrs-db
      DB_DATABASE: openmrs
      DB_USERNAME: openmrs
      DB_PASSWORD: openmrs
      DB_CREATE_TABLES: "true"
      DB_AUTO_UPDATE: "true"
      JAVA_OPTS: "-Xmx1800m -XX:MaxMetaspaceSize=512m"
    ports:
      - "8090:8080"
    depends_on:
      - openmrs-db

  openemr-db:
    image: mysql:8.0
    profiles: ["ehr"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - openemr_db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  openemr:
    image: openemr/openemr:latest
    profiles: ["ehr"]
    environment:
      MYSQL_HOST: openemr-db
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    ports:
      - "8081:80"
    depends_on:
      - openemr-db

volumes:
  openmrs_db:
  openemr_db:
